<!DOCTYPE html>
<html>
<head>
  <title>Nathan’s Lightbulb Page</title>
  <style>
    body {
      background-color: lightblue; /* changed background color */
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px;
    }
    h1 {
      color: darkblue;
    }
    p {
      font-size: 18px;
    }
    button {
      margin: 5px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Welcome, Nathan’s Webpage!</h1>
  <p>This page shows how HTML and JavaScript work together.  
     The buttons below can turn the lightbulb on and off.</p>

  <img id="lightbulb" src="https://www.w3schools.com/js/pic_bulboff.gif" alt="Lightbulb">

  <br>
  <button onclick="document.getElementById('lightbulb').src='https://www.w3schools.com/js/pic_bulbon.gif'">Turn On</button>
  <button onclick="document.getElementById('lightbulb').src='https://www.w3schools.com/js/pic_bulboff.gif'">Turn Off</button>
</body>
</html>
